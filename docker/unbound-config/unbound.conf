server:
    interface: 0.0.0.0
    port: 53
    access-control: 0.0.0.0/0 allow
    do-daemonize: no
    verbosity: 1
    use-syslog: no
    logfile: ""

    # DNSSEC validation with static trust anchors
    val-log-level: 1
    trust-anchor: "test-valid-rsa.example. 300 IN DNSKEY 257 3 8 "
    trust-anchor: "test-valid-ecdsa.example. 300 IN DNSKEY 257 3 13 JWLq9zRMtAtl0dcyP7MiNJUzCvmIfwVdS5uxF26UPnr5xIgb+PhPRZn8+/99i0qLLjfaQ3YT8gPg2qtj4x//zg=="
    trust-anchor: "test-valid-ed25519.example. 300 IN DNSKEY 257 3 15 ltpY5ZPbfAJVHXBT6YkhoXaJHuqD/oLNwR4pDvwcWao="
    trust-anchor: "test-nsec3.example. 300 IN DNSKEY 257 3 8 "
    trust-anchor: "test-bogus.example. 300 IN DNSKEY 257 3 8 "
    trust-anchor: "test-expired.example. 300 IN DNSKEY 257 3 8 "

    # Single thread for consistent timing
    num-threads: 1

    # Disable caching to isolate validation timing
    msg-cache-size: 0
    rrset-cache-size: 0
    key-cache-size: 0
    neg-cache-size: 0

    # Disable prefetching
    prefetch: no
    prefetch-key: no

    # Forward to authoritative server
    forward-zone:
        name: "."
        forward-addr: 172.20.0.10
