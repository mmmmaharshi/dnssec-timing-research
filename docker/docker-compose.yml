services:
  # Authoritative DNS server with signed zones
  auth-server:
    image: ubuntu/bind9:latest
    container_name: dnssec-auth
    privileged: true
    cap_add:
      - NET_ADMIN
    volumes:
      - ./bind-config:/etc/bind
      - ./zones:/var/cache/bind/zones
    ports:
      - "15353:53/udp"
      - "15353:53/tcp"
    networks:
      dns-test:
        ipv4_address: 172.20.0.10

  # BIND resolver with DNSSEC validation
  bind-resolver:
    image: ubuntu/bind9:latest
    container_name: dnssec-bind
    privileged: true
    cap_add:
      - NET_ADMIN
    volumes:
      - ./bind-resolver:/etc/bind
    ports:
      - "15354:53/udp"
      - "15354:53/tcp"
    networks:
      dns-test:
        ipv4_address: 172.20.0.20
    depends_on:
      - auth-server

  # Unbound resolver with DNSSEC validation
  unbound-resolver:
    image: mvance/unbound:latest
    container_name: dnssec-unbound
    volumes:
      - ./unbound-config:/opt/unbound/etc/unbound
    ports:
      - "15355:53/udp"
      - "15355:53/tcp"
    networks:
      dns-test:
        ipv4_address: 172.20.0.30
    depends_on:
      - auth-server

  # Knot Resolver
  knot-resolver:
    image: cznic/knot-resolver:latest
    container_name: dnssec-knot
    volumes:
      - ./knot-config/config.yaml:/run/knot-resolver/kresd0.conf
      - ./trust-anchors:/etc/knot-resolver/trust-anchors
    ports:
      - "15356:53/udp"
      - "15356:53/tcp"
    networks:
      dns-test:
        ipv4_address: 172.20.0.40
    depends_on:
      - auth-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/sbin/kresd", "-c", "/run/knot-resolver/kresd0.conf", "--health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  dns-test:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
