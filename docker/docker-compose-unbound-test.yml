# Test Unbound resolver with DNSSEC validation
version: "3.8"

services:
  # Authoritative server
  auth:
    image: ubuntu:22.04
    container_name: auth-server
    volumes:
      - ./bind-config/named.conf:/etc/bind/named.conf:ro
      - ./zones:/var/cache/bind/zones:ro
    networks:
      test-net:
        ipv4_address: 172.31.0.10
    cpuset: "2"
    command: >
      bash -c "
        apt-get update -qq &&
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o Dpkg::Options::='--force-confdef' -o Dpkg::Options::='--force-confold' bind9 &&
        named -g -c /etc/bind/named.conf &
        tail -f /dev/null
      "

  # Unbound resolver with DNSSEC validation
  unbound:
    image: ubuntu:22.04
    container_name: unbound-resolver
    networks:
      test-net:
        ipv4_address: 172.31.0.20
    cpuset: "0,1"
    volumes:
      - ./unbound-config/unbound-test.conf:/etc/unbound/unbound.conf:ro
    command: >
      bash -c "
        apt-get update -qq &&
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o Dpkg::Options::='--force-confdef' -o Dpkg::Options::='--force-confold' unbound dnsutils &&
        unbound -c /etc/unbound/unbound.conf -d &
        tail -f /dev/null
      "

  # Attacker
  attacker:
    image: ubuntu:22.04
    container_name: attacker
    depends_on:
      - unbound
    volumes:
      - ../harness:/research/harness:ro
      - ../results_unbound:/research/results
    networks:
      test-net:
        ipv4_address: 172.31.0.100
    cpuset: "0,1"
    privileged: true
    cap_add:
      - SYS_ADMIN
    command: >
      bash -c "
        apt-get update -qq &&
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 gcc dnsutils &&
        tail -f /dev/null
      "

networks:
  test-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
