options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion yes;
    dnssec-validation no;
    key-directory "/var/cache/bind/zones/";
    pid-file "/var/run/named/named.pid";

    // Performance settings for consistent timing
    max-cache-size 0;
    max-cache-ttl 0;
    max-ncache-ttl 0;

    // Disable prefetching
    prefetch 0 0;

    // Minimal caching
    servfail-ttl 0;
};

// Logging
logging {
    channel stderr_log {
        stderr;
        severity info;
        print-time yes;
        print-severity yes;
        print-category yes;
    };
    category default { stderr_log; };
    category queries { stderr_log; };
    category security { stderr_log; };
    category config { stderr_log; };
};

// Root zone for isolated Docker environment
// Allows Knot Resolver to do root priming without internet access
zone "." {
    type master;
    file "/var/cache/bind/zones/root.zone.signed";
};

// Test zone: valid DNSSEC-signed zone (RSA-SHA256)
zone "test-valid-rsa.example" {
    type master;
    file "/var/cache/bind/zones/test-valid-rsa.example.zone.signed";
    inline-signing yes;
    dnssec-policy none;
};

// Test zone: valid DNSSEC-signed zone (ECDSA P-256)
zone "test-valid-ecdsa.example" {
    type master;
    file "/var/cache/bind/zones/test-valid-ecdsa.example.zone.signed";
    inline-signing yes;
    dnssec-policy none;
};

// Test zone: valid DNSSEC-signed zone (Ed25519)
zone "test-valid-ed25519.example" {
    type master;
    file "/var/cache/bind/zones/test-valid-ed25519.example.zone.signed";
    inline-signing yes;
    dnssec-policy none;
};

// Test zone: intentionally broken signatures
zone "test-bogus.example" {
    type master;
    file "/var/cache/bind/zones/test-bogus.example.zone";
};

// Test zone: unsigned zone (no DNSSEC)
zone "test-unsigned.example" {
    type master;
    file "/var/cache/bind/zones/test-unsigned.example.zone";
};

// Test zone: expired signatures
zone "test-expired.example" {
    type master;
    file "/var/cache/bind/zones/test-expired.example.zone";
};

// Test zone: NSEC3 proof of non-existence
zone "test-nsec3.example" {
    type master;
    file "/var/cache/bind/zones/test-nsec3.example.zone.signed";
    inline-signing yes;
    dnssec-policy none;
};
