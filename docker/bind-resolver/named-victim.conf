options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion no;
    dnssec-validation auto;
    pid-file "/var/run/named/named.pid";

    // Minimal caching for consistent timing
    max-cache-size 0;
    max-cache-ttl 0;
    max-ncache-ttl 0;
    servfail-ttl 0;

    // Authoritative only - no forwarding
    auth-nxdomain no;
};

// Serve zones authoritatively - real DNSSEC signing work
zone "test-valid-rsa.example" {
    type master;
    file "/var/cache/bind/zones/test-valid-rsa.example.zone.signed";
    allow-query { any; };
};

zone "test-valid-ecdsa.example" {
    type master;
    file "/var/cache/bind/zones/test-valid-ecdsa.example.zone.signed";
    allow-query { any; };
};

zone "test-valid-ed25519.example" {
    type master;
    file "/var/cache/bind/zones/test-valid-ed25519.example.zone.signed";
    allow-query { any; };
};
