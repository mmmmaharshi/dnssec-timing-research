options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion yes;
    dnssec-validation auto;
    pid-file "/var/run/named/named.pid";

    // Minimal caching for consistent timing
    max-cache-size 0;
    max-cache-ttl 0;
    max-ncache-ttl 0;
    servfail-ttl 0;

    // Forward to authoritative server
    forwarders { 172.20.0.10; };
    forward only;
};

// Trust anchors for our zones
trust-anchors {
    test-valid-rsa.example. static-key 257 3 8 "";
    test-valid-ecdsa.example. static-key 257 3 13 "JWLq9zRMtAtl0dcyP7MiNJUzCvmIfwVdS5uxF26UPnr5xIgb+PhPRZn8+/99i0qLLjfaQ3YT8gPg2qtj4x//zg==";
    test-valid-ed25519.example. static-key 257 3 15 "ltpY5ZPbfAJVHXBT6YkhoXaJHuqD/oLNwR4pDvwcWao=";
    test-nsec3.example. static-key 257 3 8 "";
    test-bogus.example. static-key 257 3 8 "";
    test-expired.example. static-key 257 3 8 "";
};
